spring.application.name=Chartered-Accountant
server.port=${SERVER_PORT:8080}

# ============================== Database (local MySQL 8) ==============================
# Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ca_firm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# ============================== JPA ==============================
# Flyway owns the schema (src/main/resources/db/migration). Hibernate never creates tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ============================== Flyway ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================== Jackson ==============================
spring.jackson.time-zone=Asia/Kolkata

# ============================== File upload (resumes) ==============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.resume-dir=${RESUME_UPLOAD_DIR:uploads/resumes}

# ============================== Security ==============================
# Base64-encoded HMAC key, at least 256 bits. ALWAYS override JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktY2hhcnRlcmVkLWFjY291bnRhbnQtand0LXNlY3JldC1jaGFuZ2UtbWU=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Angular dev server. Comma-separated list for more origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# First back-office user, created at startup only when admin_user is empty.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.full-name=${ADMIN_FULL_NAME:Firm Administrator}
app.admin.email=${ADMIN_EMAIL:admin@yourfirm.in}

# ============================== API docs ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ============================== Logging ==============================
logging.level.com.ca.charteredAccountant=DEBUG

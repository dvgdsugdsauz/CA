<form class="subscribe" (submit)="$event.preventDefault(); submit()" novalidate>
  <label class="visually-hidden" for="footer-email">Email for newsletters</label>
  <input
    id="footer-email"
    type="email"
    autocomplete="email"
    placeholder="Email for tax updates"
    [formControl]="email"
    [attr.aria-invalid]="state() === 'error'"
    aria-describedby="footer-email-status"
  />
  <button class="btn btn-primary btn-sm" type="submit" [disabled]="state() === 'sending'">
    Subscribe
  </button>
</form>
<p class="status" id="footer-email-status" aria-live="polite">
  @if (state() === 'done' || state() === 'error') {
    {{ message() }}
  }
</p>

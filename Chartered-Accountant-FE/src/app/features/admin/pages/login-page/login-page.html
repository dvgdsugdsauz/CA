<main class="wrap">
  <div class="form-card login-card">
    <div class="section-head">
      <span class="eyebrow">{{ firm.name }}</span>
      <h1>Back office sign in</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-grid stacked">
        <div class="field">
          <label for="login-username">Username</label>
          <input
            id="login-username"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="showError('username')"
            [attr.aria-invalid]="showError('username')"
          />
          @if (showError('username')) {
            <span class="error">Enter your username</span>
          }
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="showError('password')"
            [attr.aria-invalid]="showError('password')"
          />
          @if (showError('password')) {
            <span class="error">Enter your password</span>
          }
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="signingIn()">
          {{ signingIn() ? 'Signing in...' : 'Sign in' }}
        </button>
        @if (showDemoHint) {
          <small>Mock API: sign in as admin / Admin@123</small>
        }
      </div>

      @if (failure()) {
        <div class="alert alert-error form-alert" role="alert">{{ failure() }}</div>
      }
    </form>
  </div>
</main>

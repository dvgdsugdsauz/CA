<app-page-header
  heading="Contact us"
  lede="Tell us about your business and what you need. A chartered accountant will call you back within one working day."
  [breadcrumbs]="breadcrumbs"
/>

<section class="band">
  <div class="wrap enquire-layout">
    <div class="form-card">
      <app-enquiry-form sourcePage="/contact" note="We call back within one working day." />
    </div>
    <div class="offices">
      @for (office of offices(); track office.locationId) {
        <app-office-details [office]="office" [showCity]="true" />
      }
    </div>
  </div>
</section>
